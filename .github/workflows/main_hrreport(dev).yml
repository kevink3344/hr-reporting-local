# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - hrreport

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      # This repo is a two-package workspace: the API lives at the root and the
      # React client lives in ./client with its own package-lock.json. Installing
      # only at the root leaves client/node_modules empty, so the client
      # typecheck cannot resolve react / react-dom / lucide-react and fails with
      #   "Cannot find module 'react'"
      #   "Cannot find module 'lucide-react'"
      #   "JSX element implicitly has type 'any' because no interface
      #    'JSX.IntrinsicElements' exists."
      # Both dependency trees must be installed before the build runs.
      - name: Install dependencies (root + client)
        run: |
          npm ci
          npm ci --prefix client

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'hrreport'
          slot-name: 'dev'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_4DDD49FAC403460196B11BF620EBBB96 }}